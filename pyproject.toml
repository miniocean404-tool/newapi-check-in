[project]
name = "anyrouter-check-in"
version = "0.1.0"
description = "Anyrouter or newapi system check in"
requires-python = ">=3.11"
# 生产环境依赖
dependencies = [
  "httpx[http2]>=0.28.1",
  "playwright>=1.57.0",
  "python-dotenv>=1.2.1",
  "stealth_requests>=2.0.4",
  "cloudscraper@git+https://github.com/VeNoMouS/cloudscraper.git@3.0.0",
  "requests>=2.32.5",
]

# 开发环境依赖
[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-mock>=3.11.1",
  "pytest-cov>=4.1.0",
  "python-dotenv>=1.0.0",
  "ruff>=0.14.11",
  "pre-commit>=4.5.1",
]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["ASYNC", "E", "F", "FAST", "I", "PLE"]
ignore = ["ASYNC109", "ASYNC230", "E101", "E402", "E501", "F841", "E731"]
unfixable = ["E101", "E402", "E501", "F841", "E731"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true
